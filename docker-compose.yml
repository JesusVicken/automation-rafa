version: '3.8'

services:
  wpp-ocr-financeiro:
    build: .
    container_name: wpp-ocr-financeiro
    restart: always
    env_file:
      - .env
    volumes:
      # Monta o arquivo .env
      - ./.env:/app/.env
      # Monta a pasta de autenticação para persistir a sessão entre reboots
      - ./auth_info_baileys:/app/auth_info_baileys
    environment:
      - TZ=America/Sao_Paulo
